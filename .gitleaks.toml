title = "Infiproxy secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Generated artifacts and exact non-secret protocol parser fixtures"
regexTarget = "line"
paths = [
  '''^target/''',
  '''^\.runtime/''',
]
regexes = [
  '''^\s*"secret\.short-id": "0123456789abcdef",\s*$''',
  '''^\s*"secret\.password": "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=",\s*$''',
]
