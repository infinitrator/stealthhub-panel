[workspace]
resolver = "2"
members = [
  "crates/stealthhub-core",
  "crates/stealthhub-panel",
  "crates/stealthhub-cli"
]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
authors = ["Fedor Korneev"]
repository = "https://github.com/infinitrator/stealthhub-panel"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
maud = { version = "0.27", features = ["axum"] }
getrandom = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
clap = { version = "4", features = ["derive"] }
subtle = "2"
