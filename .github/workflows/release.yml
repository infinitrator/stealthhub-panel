name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: 1.96.0

      - name: Build panel
        run: cargo build --locked --release -p stealthhub-panel

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/infiproxy-linux-x86_64
          cp target/release/stealthhub-panel dist/infiproxy-linux-x86_64/infiproxy
          cp target/release/infiproxy-module-manifest dist/infiproxy-linux-x86_64/
          cp target/release/infiproxy-headscale-control dist/infiproxy-linux-x86_64/
          cp -R deploy wiki README.md LICENSE LICENSE.ru.md dist/infiproxy-linux-x86_64/
          tar -C dist -czf infiproxy-linux-x86_64.tar.gz infiproxy-linux-x86_64
          sha256sum infiproxy-linux-x86_64.tar.gz > infiproxy-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infiproxy-linux-x86_64
          path: |
            infiproxy-linux-x86_64.tar.gz
            infiproxy-linux-x86_64.tar.gz.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              infiproxy-linux-x86_64.tar.gz \
              infiproxy-linux-x86_64.tar.gz.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              infiproxy-linux-x86_64.tar.gz \
              infiproxy-linux-x86_64.tar.gz.sha256 \
              --verify-tag --generate-notes "${prerelease[@]}"
          fi
