name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Documentation contracts
        run: bash deploy/tests/wiki-check.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find deploy -type f -name '*.sh' -exec shellcheck -x {} +

      - name: Deployment contracts
        run: |
          set -euo pipefail
          find deploy -type f -name '*.sh' -exec bash -n {} +
          cargo build --locked -p stealthhub-panel --bins
          target/debug/infiproxy-module-manifest list deploy/modules.d
          bash deploy/tests/install-state-regression.sh
          bash deploy/tests/updater-regression.sh
          bash deploy/tests/manager-regression.sh
          bash deploy/tests/http-smoke.sh
          bash deploy/install.sh --check
          bash deploy/bootstrap.sh --check --src-dir "$PWD"

      - name: Dependency audit
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          command: check
          arguments: --all-features
